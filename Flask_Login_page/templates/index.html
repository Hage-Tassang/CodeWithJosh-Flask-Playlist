{%extends "base.html"%}
{%block body%}

    <div class= "container">
        <h2>Welcome to the Flask Authentication Demo!</h2>
        <form id="auth-form" action="{{url_for('login')}}" method = "post">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-person-circle" viewBox="0 0 16 16">
            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
        </svg>
            <input 
                type="text"
                name="username"
                placeholder="username"
                class="input-field"
            />
            <br>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-person-lock" viewBox="0 0 16 16">
            <path d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m0 5.996V14H3s-1 0-1-1 1-4 6-4q.845.002 1.544.107a4.5 4.5 0 0 0-.803.918A11 11 0 0 0 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664zM9 13a1 1 0 0 1 1-1v-1a2 2 0 1 1 4 0v1a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1zm3-3a1 1 0 0 0-1 1v1h2v-1a1 1 0 0 0-1-1"/>
        </svg>
            <input 
                type="password"
                name="password"
                placeholder="password"
                class="input-field"
            />
            <hr>
            <div class="login-register">
                <p>Don't have an account?</p>
                <p>Register now!</p>
            </div>
            <input 
                type="submit" 
                value="Login" 
                class="btn btn-login" 
                onclick = "setActionForm('login')"
            />  
            <input 
                type="button" 
                value="Register" 
                class="btn btn-login"
                onclick = "setActionForm('register')"
            />
        </form>
        {%if message%}
            <p class="message">{{message}}</p>
        {%endif%}
    </div>
    <div class="second-background">
        <div class="colored-bg">
            
        </div>
    </div>
    
<script>
    /*function to check the action form for login and register buttons*/
    function setActionForm(action){
        let form = document.getElementById('auth-form');
        if (action ==='login'){
            form.action = "{{url_for('login')}}";
            form.method = "post";
            form.submit();
        } else if (action ==='register'){
            form.action = "{{url_for('register')}}";
            form.method = "post";
            form.submit();
        }
        
    }
</script>

{%endblock%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask-SocketIO-Chat-Room</title>
    <link 
        rel="stylesheet" 
        href="{{ url_for('static', filename='styles.css') }}"
    />
</head>
<body>
    <h2>welcome, <span id="username">{{username}}</span></h2>
    <div class="container">
        <div class="sidebar">
            <div class="room-list">
                <h3>Rooms</h3>
                {% for room in rooms %}
                <div class="room-items">
                    {{rooms}}
                </div>
                {% endfor %}

                <div class="user-list">
                    <h3>Online Users</h3>
                    <div id="active-users"></div>
                </div>
            </div>
            <div class="main-chat">
                <div id="chat"></div>
                <div class="input-area">
                    <input type="text" id="message" placeholder="Enter text here..."/>
                </div>
                <button>send</button>
            </div>
        </div>
    </div>
</body>
</html>
